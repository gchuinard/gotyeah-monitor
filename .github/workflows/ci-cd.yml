name: CI/CD GotYeah Monitor

# Aucun test automatisé dans ce dépôt, ni API ni front (constaté le 25/09/2026) : cette CI
# vérifie l'installation des dépendances, la syntaxe Python (compileall, qui n'exécute rien),
# le lint et le build du front. Le jour où une suite de tests existe, l'ajouter ici.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend:
    name: API (FastAPI) - build simple
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          # Même version que la production (image python:3.11-slim de api/Dockerfile.prod,
          # 3.11.16 dans monitor_api_prod le 25/09/2026). Jusque-là la CI tournait en 3.14 :
          # une syntaxe propre à 3.12 ou plus y passait, et n'aurait cassé qu'en production.
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: Vérifier que le code se compile
        run: python -m compileall .

  frontend:
    name: Front (SvelteKit) - lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "front/package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  deploy:
    name: Deploy sur le Pi
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Sans empreinte, appleboy/ssh-action désactive la vérification de l'hôte
      # en silence : on refuse donc de déployer si le secret est vide.
      - name: Vérifier que l'empreinte du Pi et la clé de déploiement sont configurées
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::Secret SSH_HOST_FINGERPRINT absent : sans lui, le déploiement accepterait n'importe quel hôte."
            exit 1
          fi
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY absent."
            exit 1
          fi

      - name: Déployer sur le Raspberry Pi via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Clé dédiée à Monitor depuis le 25/09/2026. Sur le Pi, authorized_keys la force sur
          # « /usr/local/sbin/gotyeah-deploy monitor » : git pull de main puis deploy/pi-deploy.sh.
          # Elle ne peut rien faire d'autre.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          # Empreinte ECDSA du Pi (secret, jamais en clair dans ce dépôt public) :
          # un hôte qui présente une autre clé fait échouer la connexion (24/09).
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          # Ignorée par le Pi (commande forcée) : les étapes, retour arrière compris,
          # vivent dans deploy/pi-deploy.sh.
          script: deploy
